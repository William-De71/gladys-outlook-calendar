<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">
    <rect x="20" y="70" width="220" height="150" rx="14" fill="#e8f1fb" stroke="#2f6fb5" stroke-width="2"/>
    <text x="130" y="110" font-size="20" font-weight="bold" fill="#1f2328">Gladys Assistant</text>
    <text x="130" y="140" font-size="14" fill="#57606a">My calendars:</text>
    <text x="130" y="160" font-size="14" fill="#57606a">calendar view,</text>
    <text x="130" y="180" font-size="14" fill="#57606a">scenes, assistant</text>
    <rect x="340" y="70" width="220" height="150" rx="14" fill="#eef8f0" stroke="#1a7f37" stroke-width="2"/>
    <text x="450" y="105" font-size="16" font-weight="bold" fill="#1f2328">gladys-outlook-calendar</text>
    <text x="450" y="135" font-size="14" fill="#57606a">Docker container</text>
    <text x="450" y="155" font-size="14" fill="#57606a">sign-in codes,</text>
    <text x="450" y="175" font-size="14" fill="#57606a">sync per user,</text>
    <text x="450" y="195" font-size="14" fill="#57606a">tokens in /data</text>
    <rect x="660" y="70" width="220" height="150" rx="14" fill="#eaf1fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="770" y="105" font-size="17" font-weight="bold" fill="#1f2328">Microsoft</text>
    <text x="770" y="135" font-size="14" fill="#57606a">login.microsoftonline.com</text>
    <text x="770" y="150" font-size="14" fill="#57606a">(sign-in)</text>
    <text x="770" y="180" font-size="12" fill="#57606a">graph.microsoft.com</text>
    <text x="770" y="198" font-size="12" fill="#57606a">/me/calendars, calendarView</text>
    <path d="M245 125 H335" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="290" y="105" font-size="12" fill="#57606a">REST</text>
    <text x="290" y="150" font-size="12" fill="#57606a">+ WebSocket</text>
    <text x="290" y="245" font-size="12" fill="#57606a">/api/integration/v1/*</text>
    <path d="M565 125 H655" stroke="#57606a" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="610" y="105" font-size="12" fill="#57606a">HTTPS</text>
    <text x="610" y="150" font-size="12" fill="#57606a">Bearer token</text>
    <text x="450" y="275" font-size="13" fill="#57606a">Cloud transport, read-only: calendars are read from Microsoft (HTTPS). Illustration.</text>
  </g>
</svg>
